@for (o of havuz; track $index) {
  <span #oge [class]="'saat saat--' + o.tur" [style.--aci.deg]="o.aci" [style.--olcek]="o.olcek">
    @if (o.tur === 'dijital') {
      <svg class="saat__ikon" viewBox="0 0 24 24"><path d="M10 2h4" /><circle cx="12" cy="13.5" r="8" /><line class="saat__ibre" x1="12" y1="13.5" x2="12" y2="8.5" /></svg>
      <span class="saat__rakam">05:00</span>
    } @else {
      <svg viewBox="0 0 48 48">
        <rect class="saat__tepe" x="20" y="2" width="8" height="5" rx="1.5" />
        <path d="M36 9l4 4" />
        <circle class="saat__govde" cx="24" cy="27" r="17" />
        <line class="saat__ibre" x1="24" y1="27" x2="24" y2="15" />
        <circle class="saat__merkez" cx="24" cy="27" r="2.6" />
      </svg>
    }
  </span>
}
